name: Windows x64 portable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.2-obtito.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build portable executable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
            throw 'Use a version tag such as v0.1.2-obtito.1.'
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/desktop tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Verify architecture and prepare release files
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $binary = Get-Item 'target/x86_64-pc-windows-msvc/release/pinkbin.exe' -ErrorAction Stop
          $reader = [IO.BinaryReader]::new($binary.OpenRead())
          try {
            if ($reader.ReadUInt16() -ne 0x5A4D) {
              throw 'The built file is not a Windows executable.'
            }
            $reader.BaseStream.Position = 0x3C
            $peOffset = $reader.ReadUInt32()
            $reader.BaseStream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x4550 -or $reader.ReadUInt16() -ne 0x8664) {
              throw 'The built file is not a Windows x64 PE executable.'
            }
          } finally {
            $reader.Dispose()
          }

          $output = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'pinkbin-portable')
          $version = $env:RELEASE_TAG.Substring(1)
          $filename = "Pinkbin_${version}_portable_x64.exe"
          $destination = Join-Path $output.FullName $filename
          Copy-Item -LiteralPath $binary.FullName -Destination $destination
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $destination).Hash.ToLowerInvariant()
          $checksums = Join-Path $output.FullName 'SHA256SUMS.txt'
          [IO.File]::WriteAllText($checksums, "$hash  $filename`n", [Text.Encoding]::ASCII)

      - uses: actions/upload-artifact@v4
        with:
          name: pinkbin-portable
          path: ${{ runner.temp }}/pinkbin-portable
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pinkbin-portable
          path: dist
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        working-directory: dist
        shell: bash
        run: |
          sha256sum --check --strict SHA256SUMS.txt
          gh release create "$RELEASE_TAG" \
            "Pinkbin_${RELEASE_TAG#v}_portable_x64.exe" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Pinkbin ${RELEASE_TAG#v} · Windows x64 便携版" --notes-file - <<'NOTES'
          ## 第一次使用

          1. 在下方 **Assets** 下载文件名以 `_portable_x64.exe` 结尾的文件。保存到 D 盘等有空余空间的位置，双击运行，无需安装。
          2. 在窗口顶部选择 `C:`，点「扫描」。扫完就能看哪些文件夹占空间，单独扫盘无需配置 AI。
          3. 想请 AI 分析时，点右上角齿轮打开「AI 顾问设置」。填写服务商提供的 **Base URL、API Key 和模型名**，然后保存。使用 OpenAI 兼容服务时，可在「手动指定」中选择「OpenAI 兼容」。
          4. 把不认识的大文件夹从扫描结果拖进聊天框。可以先问「这个目录是做什么的？可以挪到 D 盘吗？」看完建议后再决定如何处理。

          [查看操作界面示例](https://github.com/obtito/pinkbin/blob/main/docs/screenshots/hero.png)

          ## 系统和校验

          适用于 Windows 10/11 x64，依赖 Microsoft Edge WebView2 Runtime。此 EXE 未做代码签名。`SHA256SUMS.txt` 包含便携 EXE 的 SHA-256 校验值。使用云端 AI 分析时，所选目录的路径、大小及样本路径会发给你配置的服务商。
          NOTES
